    [
     'left_thumb_1_joint',
     'left_thumb_2_joint',
     'left_index_1_joint',
     'left_middle_1_joint',
     'left_ring_1_joint',
     'left_little_1_joint'
    ]

  # for DexPilot type
  wrist_link_name: "base_link"
  finger_tip_link_names: [ "thumb_tip", "index_tip", "middle_tip", "ring_tip", "little_tip" ]
  target_link_human_indices_dexpilot: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24,  0,  0,  0,  0,  0], [ 4,  4,  4,  4,  9, 9,  9, 14, 14, 19,  4,  9, 14, 19, 24]]

