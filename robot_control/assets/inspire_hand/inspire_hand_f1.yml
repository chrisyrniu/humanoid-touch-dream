  target_task_link_names: [ "thumb_tip", "index_tip", "middle_tip", "ring_tip", "little_tip" ]
  target_link_human_indices_vector: [ [ 0, 0, 0, 0, 0 ], [ 4, 9, 14, 19, 24 ] ]

  scaling_factor: 1.20
  low_pass_alpha: 0.2

