      tanh_end: False
      ln: True
      token_num: 4
    robot_joint_pos_proprio:
      input_dim: 29
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 1
    left_eef_joint_pos_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 1
    right_eef_joint_pos_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 1
    ### touch modalities
    # finger force
    left_eef_finger_force_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    right_eef_finger_force_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    # tactile
    left_pinky_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    right_pinky_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    left_ring_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    right_ring_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    left_middle_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    right_middle_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    left_index_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    right_index_tactile:
      input_dim: 185
      output_dim: 16
      token_num: 2
    left_thumb_tactile:
      input_dim: 210
      output_dim: 16
      token_num: 2
    right_thumb_tactile:
      input_dim: 210
      output_dim: 16
      token_num: 2
    left_palm_tactile:
      input_dim: 112
      output_dim: 16
      token_num: 2
    right_palm_tactile:
      input_dim: 112
      output_dim: 16
      token_num: 2
  action_head:
    body_pose:
      type: transformer
      input_dim: 512
      output_dim: 6
      crossattn_modality_dropout: 0.1
      crossattn_heads: 8
      crossattn_dim_head: 32
      action_horizon: 60
      loss_weight: 1.0
    left_eef_to_body_pose:
      type: transformer
      input_dim: 512
