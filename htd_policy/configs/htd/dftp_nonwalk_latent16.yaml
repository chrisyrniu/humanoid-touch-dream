      weights: DEFAULT
      resnet_model: resnet18
      split_dual: True
      token_num: 128
    left_wrist_image:
      output_dim: 512 # this needs to be the same as tokenizer.hidden_dim
      weights: DEFAULT
      resnet_model: resnet18
      token_num: 64
    right_wrist_image:
      output_dim: 512 # this needs to be the same as tokenizer.hidden_dim
      weights: DEFAULT
      resnet_model: resnet18
      token_num: 64
    body_pose_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    eef_pose_proprio:
      input_dim: 12
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    left_eef_to_body_pose_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    right_eef_to_body_pose_proprio:
