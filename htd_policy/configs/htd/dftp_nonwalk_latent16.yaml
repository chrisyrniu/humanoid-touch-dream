# DFTP nonwalk: head and wrist cameras, 16-dimensional tactile latents.
normalize_state: True
human:
  tokenizer:
    hidden_dim: 512 # Cross-attention token width.
    nhead: 8
    dim_head: 64
    dropout: 0.1
    main_image:
      output_dim: 512 # this needs to be the same as tokenizer.hidden_dim
      weights: DEFAULT
      resnet_model: resnet18
      split_dual: True
      token_num: 16
    body_pose_proprio:
      input_dim: 6
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 2
    eef_pose_proprio:
      input_dim: 12
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 4
    eef_to_body_pose_proprio:
      input_dim: 12
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 2
    eef_state_proprio:
      input_dim: 12
      output_dim: 512
      widths: [512, 512]
      tanh_end: False
      ln: True
      token_num: 6
  action_head:
    eef_pose:
      type: transformer
      input_dim: 512
      output_dim: 12
      crossattn_modality_dropout: 0.1
      crossattn_heads: 8
      crossattn_dim_head: 32
      action_horizon: 60
      loss_weight: 1.0
    body_pose:
      type: transformer
      input_dim: 512
      output_dim: 6
      crossattn_modality_dropout: 0.1
      crossattn_heads: 8
      crossattn_dim_head: 32
      action_horizon: 60
      loss_weight: 1.0
    eef_joints:
      type: transformer
      input_dim: 512
      output_dim: 12
      crossattn_modality_dropout: 0.1
      crossattn_heads: 8
      crossattn_dim_head: 32
      action_horizon: 60
      loss_weight: 1.0

g1_inspire_wb:
  ema_decay: 0.999
  tokenizer:
    hidden_dim: 512 # Cross-attention token width.
    nhead: 8
    dim_head: 64
    dropout: 0.1
    main_image:
